# Off a title the reveal map is the identity - `reveal_order` reads 0 - so every
# pixel counts as already reached and the effect is a no-op: what goes in comes
# back out, at every slider setting. These probes pin exactly that, the colour
# unchanged through the display round-trip, at the default, the minimum and the
# maximum. The word-by-word lighting only shows over a title with a reveal map,
# which a flat probe has none of.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "default, an orange"
input = [0.8, 0.3, 0.05, 1]
expect = [0.8, 0.3, 0.05, 1]

[[probe]]
name = "minimum, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

[[probe]]
name = "maximum, a grey"
at = "max"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]
